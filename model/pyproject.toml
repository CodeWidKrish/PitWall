[project]
name = "pitwall-model"
version = "0.1.0"
description = "PitWall forecasting model: data pipeline, features, training, backtest and season simulation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Krish Hingu" }]
dependencies = [
    "fastf1>=3.6",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "requests>=2.32",
]

[project.scripts]
pitwall = "pitwall.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pitwall"]

[[tool.mypy.overrides]]
module = ["fastf1.*", "lightgbm.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
