name: Post-race update

# Through every race weekend: after qualifying the odds are re-run with the grid, after a
# sprint its result is added, and after the Grand Prix the title simulations are re-run and
# the next race takes over. Each run commits the site's data and the push redeploys it.
# Runs daily (results can land late) and does nothing unless something new is in.
on:
  schedule:
    - cron: "30 6 * * *" # every morning, 06:30 UTC
    - cron: "30 20 * * 6" # Saturday evenings, after most qualifying sessions and sprints
    - cron: "30 21 * * 0" # and Sunday evenings, soon after most races
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the site data even if no new race is in
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-race-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore API caches
        uses: actions/cache@v4
        with:
          path: ~/.cache/pitwall
          key: pitwall-api-${{ github.run_id }}
          restore-keys: pitwall-api-

      - run: uv sync --python 3.12

      - name: Build and check the data
        run: uv run pitwall data build

      - name: Is there anything new?
        id: check
        run: |
          uv run python - <<'EOF'
          import json, os
          import pandas as pd
          site = json.load(open("../web/src/data/site.json", encoding="utf-8"))
          done = pd.read_parquet("data/processed/entries.parquet")
          done = done[done["position"].notna()]
          season = int(done["season"].max())
          latest = int(done[done["season"] == season]["round"].max())
          was = site["data_through"]
          race = (season, latest) != (was["season"], was["round"])
          # Mid-weekend: qualifying or the sprint for the next race has come in.
          weekend, label = False, f"{season} R{latest}"
          nxt = site.get("next_race") or {}
          if not race and nxt:
              key = (nxt["season"], nxt["round"])
              q = pd.read_parquet("data/processed/qualifying.parquet")
              s = pd.read_parquet("data/processed/sprints.parquet")
              has_q = not q[(q["season"] == key[0]) & (q["round"] == key[1])].empty
              has_s = not s[(s["season"] == key[0]) & (s["round"] == key[1])].empty
              sprint_done = bool((nxt.get("sprint") or {}).get("result"))
              if has_q and nxt.get("stage") != "post_quali":
                  weekend, label = True, f"{key[0]} R{key[1]} qualifying"
              elif has_s and nxt.get("sprint") and not sprint_done:
                  weekend, label = True, f"{key[0]} R{key[1]} sprint"
              elif not nxt.get("start_utc"):
                  # Next season's official calendar: export once its start times are out.
                  import requests
                  try:
                      url = f"https://api.jolpi.ca/ergast/f1/{key[0]}.json"
                      races = requests.get(url, timeout=30).json()["MRData"]["RaceTable"]["Races"]
                      if any(r.get("time") for r in races):
                          weekend, label = True, f"{key[0]} calendar"
                  except Exception as exc:
                      print(f"calendar check skipped: {exc}")
          print(f"data through {season} R{latest}; site shows {was['season']} R{was['round']}; "
                f"new race: {race}; weekend update: {weekend}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"new={'true' if race else 'false'}\n")
              f.write(f"weekend={'true' if weekend else 'false'}\n")
              f.write(f"label={label}\n")
          EOF

      - name: Simulate both championships
        if: steps.check.outputs.new == 'true' || inputs.force
        run: |
          uv run pitwall model simulate
          uv run pitwall model simulate --season "$(uv run python -c 'from pitwall.config import Settings; print(Settings().forecast_season)')"

      - name: Export the site data
        if: steps.check.outputs.new == 'true' || steps.check.outputs.weekend == 'true' || inputs.force
        run: |
          uv run pitwall site export
          uv run pitwall site photos

      - name: Commit and push
        if: steps.check.outputs.new == 'true' || steps.check.outputs.weekend == 'true' || inputs.force
        working-directory: .
        run: |
          git config user.name "Krish Hingu"
          git config user.email "186566738+CodeWidKrish@users.noreply.github.com"
          git add web/src/data web/public/data web/public/drivers model/reports
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "data: update after ${{ steps.check.outputs.label }}"
          git push
