      <animate attributeName="width" values="0;273.28000000000003;273.28000000000003;0" keyTimes="0;.18;.92;1" dur="9s" begin="0.82s" repeatCount="indefinite" calcMode="spline" keySplines=".16 1 .3 1;0 0 1 1;.7 0 .84 0"/>
