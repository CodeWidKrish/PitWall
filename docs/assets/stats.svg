<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="151 races backtested, 58% winners after quali, 89% winner in our top 3, 10,000 seasons per forecast, 0 car contact in tests">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17161d"/><stop offset="1" stop-color="#0f1013"/></linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ecedef"/><stop offset="1" stop-color="#b98cff"/></linearGradient>
    <style>
      .n { font: italic 900 46px 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif; fill: url(#num); }
      .l { font: 600 13px Consolas, Menlo, 'DejaVu Sans Mono', monospace; fill: #8a9099; letter-spacing: 1.6px; }
      .tile { opacity: 0; animation: rise .8s cubic-bezier(.16,1,.3,1) forwards; }
      .t2 { animation-delay: .15s; } .t3 { animation-delay: .3s; } .t4 { animation-delay: .45s; } .t5 { animation-delay: .6s; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .bar { transform-box: fill-box; transform-origin: left; animation: fill 3.2s cubic-bezier(.16,1,.3,1) infinite; }
      @keyframes fill { 0% { transform: scaleX(0); } 45%,85% { transform: scaleX(1); } 100% { transform: scaleX(0); opacity: 0; } }
    </style>
  </defs>
  <g class="tile t1"><rect x="10" y="15" width="220" height="140" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity=".08"/>
    <rect class="bar" x="34" y="34" width="172" height="4" rx="2" fill="#8f45ff" style="animation-delay:0.00s"/>
    <text x="120" y="98" text-anchor="middle" class="n">151</text><text x="120" y="130" text-anchor="middle" class="l">RACES BACKTESTED</text></g>
  <g class="tile t2"><rect x="250" y="15" width="220" height="140" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity=".08"/>
    <rect class="bar" x="274" y="34" width="172" height="4" rx="2" fill="#a46bff" style="animation-delay:0.25s"/>
    <text x="360" y="98" text-anchor="middle" class="n">58%</text><text x="360" y="130" text-anchor="middle" class="l">WINNERS AFTER QUALI</text></g>
  <g class="tile t3"><rect x="490" y="15" width="220" height="140" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity=".08"/>
    <rect class="bar" x="514" y="34" width="172" height="4" rx="2" fill="#14b3a4" style="animation-delay:0.50s"/>
    <text x="600" y="98" text-anchor="middle" class="n">89%</text><text x="600" y="130" text-anchor="middle" class="l">WINNER IN OUR TOP 3</text></g>
  <g class="tile t4"><rect x="730" y="15" width="220" height="140" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity=".08"/>
    <rect class="bar" x="754" y="34" width="172" height="4" rx="2" fill="#3ad1c1" style="animation-delay:0.75s"/>
    <text x="840" y="98" text-anchor="middle" class="n">10,000</text><text x="840" y="130" text-anchor="middle" class="l">SEASONS PER FORECAST</text></g>
  <g class="tile t5"><rect x="970" y="15" width="220" height="140" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity=".08"/>
    <rect class="bar" x="994" y="34" width="172" height="4" rx="2" fill="#ff2a36" style="animation-delay:1.00s"/>
    <text x="1080" y="98" text-anchor="middle" class="n">0</text><text x="1080" y="130" text-anchor="middle" class="l">CAR CONTACT IN TESTS</text></g>
</svg>
