<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="A race weekend on PitWall: Thursday the odds are published, Saturday they are re-run with the grid, Sunday the race decides, Sunday night the call is scored in public, the title is re-simulated and the site redeploys">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c0e"/><stop offset=".6" stop-color="#121019"/><stop offset="1" stop-color="#0b0c0e"/></linearGradient>
    <linearGradient id="sector" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f45ff"/><stop offset="1" stop-color="#b98cff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="300" rx="22"/></clipPath>
    
    <style>
  .h   { font: italic 900 34px 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif; fill: #ecedef; letter-spacing: -.3px; }
  .hs  { font: italic 400 18px Georgia, 'Times New Roman', serif; fill: #b4b8bf; }
  .ct  { font: italic 800 21px 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif; fill: #ecedef; }
  .cl  { font: 500 13px Consolas, Menlo, 'DejaVu Sans Mono', monospace; fill: #c9ccd2; }
  .tg  { font: 700 11px Consolas, Menlo, 'DejaVu Sans Mono', monospace; fill: #8a9099; letter-spacing: 2px; }
  .num { font: italic 900 30px 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif; fill: #ecedef; }
  .sm  { font: 600 12px Consolas, Menlo, 'DejaVu Sans Mono', monospace; fill: #8a9099; }
  .flow { stroke-dasharray: 6 9; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -30; } }
  .breathe { animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { stroke-opacity: .45; } 50% { stroke-opacity: 1; } }</style>
  </defs>
  <g clip-path="url(#frame)">
  <rect width="1200" height="300" fill="url(#bg)"/><rect width="1200" height="300" fill="url(#grid)"/>

  <text x="60" y="56" class="h">ONE RACE WEEKEND ON PITWALL</text>
  <line x1="70" y1="170" x2="856" y2="170" stroke="#2a2833" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="170" x2="70" y2="170" stroke="#8f45ff" stroke-width="4" stroke-linecap="round"><animate attributeName="x2" values="70;856;856;70" keyTimes="0;.75;.95;1" dur="10s" repeatCount="indefinite"/></line>
  <circle cx="70" cy="170" r="11" fill="#16151c" stroke="#2a2833" stroke-width="3"/>
  <circle cx="70" cy="170" r="7" fill="#8f45ff" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.00;0.02;.95;1" dur="10s" repeatCount="indefinite"/></circle>
  <g>
    <text x="70" y="118" class="tg">THURSDAY</text>
    <text x="70" y="144" class="ct">Odds published</text>
    <text x="70" y="210" class="cl">win + podium chance for all 22</text>
  </g>
  <circle cx="332" cy="170" r="11" fill="#16151c" stroke="#2a2833" stroke-width="3"/>
  <circle cx="332" cy="170" r="7" fill="#8f45ff" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.27;.95;1" dur="10s" repeatCount="indefinite"/></circle>
  <g>
    <text x="332" y="118" class="tg">SATURDAY</text>
    <text x="332" y="144" class="ct">Grid is known</text>
    <text x="332" y="210" class="cl">odds re-run with the qualifying gaps</text>
  </g>
  <circle cx="594" cy="170" r="11" fill="#16151c" stroke="#2a2833" stroke-width="3"/>
  <circle cx="594" cy="170" r="7" fill="#8f45ff" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.50;0.52;.95;1" dur="10s" repeatCount="indefinite"/></circle>
  <g>
    <text x="594" y="118" class="tg">SUNDAY</text>
    <text x="594" y="144" class="ct">Lights out</text>
    <text x="594" y="210" class="cl">the race decides</text>
  </g>
  <circle cx="856" cy="170" r="11" fill="#16151c" stroke="#2a2833" stroke-width="3"/>
  <circle cx="856" cy="170" r="7" fill="#22c55e" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;.95;1" dur="10s" repeatCount="indefinite"/></circle>
  <g>
    <text x="856" y="118" class="tg">SUNDAY NIGHT</text>
    <text x="856" y="144" class="ct">Scored in public</text>
    <text x="856" y="210" class="cl">hit or miss, re-simulated, redeployed</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.76;.8;.95;1" dur="10s" repeatCount="indefinite"/>
    <rect x="370" y="236" width="460" height="32" rx="16" fill="#16301f" stroke="#22c55e" stroke-opacity=".6"/>
    <text x="600" y="257" text-anchor="middle" class="cl" style="fill:#bff5cf;font-weight:700">✓ new results in → GitHub Action commits → site redeploys</text>
  </g>
  <rect x="0" y="294" width="1200" height="6" fill="url(#sector)"/>
  </g>
</svg>
