<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="14" viewBox="0 0 1200 14" role="img" aria-label="section divider">
  <style>.s { transform-box: fill-box; transform-origin: left; animation: s 4.5s cubic-bezier(.16,1,.3,1) infinite; } .s2 { animation-delay: .35s; } .s3 { animation-delay: .7s; }
  @keyframes s { 0% { transform: scaleX(0); } 40%,85% { transform: scaleX(1); } 100% { transform: scaleX(1); opacity: 0; } }</style>
  <rect x="0" y="5" width="1200" height="4" rx="2" fill="#8a9099" fill-opacity=".18"/>
  <rect class="s" x="0" y="5" width="396" height="4" rx="2" fill="#f5c518"/>
  <rect class="s s2" x="402" y="5" width="396" height="4" rx="2" fill="#22c55e"/>
  <rect class="s s3" x="804" y="5" width="396" height="4" rx="2" fill="#8f45ff"/>
</svg>
