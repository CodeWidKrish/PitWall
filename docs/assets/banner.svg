<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="PitWall: who wins the next Grand Prix? An F1 race and championship forecaster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c0e"/>
      <stop offset="0.6" stop-color="#121019"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8f45ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8f45ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="red" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2a36"/>
      <stop offset="0.55" stop-color="#d0101c"/>
      <stop offset="1" stop-color="#5a060c"/>
    </radialGradient>
    <linearGradient id="sector" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f45ff"/>
      <stop offset="1" stop-color="#b98cff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="22"/></clipPath>
    <style>
      .t  { font: italic 900 96px 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif; fill: #ecedef; letter-spacing: -1px; }
      .tl { font: italic 300 96px 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif; fill: #ecedef; letter-spacing: -1px; }
      .s  { font: italic 400 26px Georgia, 'Times New Roman', serif; fill: #c4c8ce; }
      .m  { font: 600 13px Consolas, Menlo, 'DejaVu Sans Mono', monospace; fill: #8a9099; letter-spacing: 2.6px; }
      .k  { font: 700 13px Consolas, Menlo, 'DejaVu Sans Mono', monospace; fill: #ecedef; letter-spacing: 1.5px; }

      /* the racing line draws itself, then a car runs it forever */
      .track { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 2.4s cubic-bezier(.16,1,.3,1) .2s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .sec { stroke-dasharray: 120 1280; animation: lap 4.2s linear 2s infinite; opacity: 0; }
      @keyframes lap { 0% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: -1400; opacity: 1; } }

      /* five lights, one by one, then out */
      .l { opacity: .12; animation: light 6s steps(1) infinite; }
      .l1 { animation-name: l1; } .l2 { animation-name: l2; } .l3 { animation-name: l3; } .l4 { animation-name: l4; } .l5 { animation-name: l5; }
      @keyframes l1 { 0% { opacity: .12; } 8%  { opacity: 1; } 62% { opacity: .12; } }
      @keyframes l2 { 0% { opacity: .12; } 18% { opacity: 1; } 62% { opacity: .12; } }
      @keyframes l3 { 0% { opacity: .12; } 28% { opacity: 1; } 62% { opacity: .12; } }
      @keyframes l4 { 0% { opacity: .12; } 38% { opacity: 1; } 62% { opacity: .12; } }
      @keyframes l5 { 0% { opacity: .12; } 48% { opacity: 1; } 62% { opacity: .12; } }
      .go { opacity: 0; animation: go 6s steps(1) infinite; }
      .pre { animation: pre 6s steps(1) infinite; }
      @keyframes pre { 0% { opacity: 1; } 62% { opacity: 0; } 92% { opacity: 1; } }
      @keyframes go { 0% { opacity: 0; } 62% { opacity: 1; } 92% { opacity: 0; } }

      .rise { opacity: 0; animation: rise 1s cubic-bezier(.16,1,.3,1) forwards; }
      .r2 { animation-delay: .25s; } .r3 { animation-delay: .5s; } .r4 { animation-delay: .75s; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      .breathe { animation: breathe 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes breathe { 0%,100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse class="breathe" cx="930" cy="190" rx="330" ry="210" fill="url(#glow)"/>

    <!-- a circuit outline on the right -->
    <g transform="translate(760 62) scale(0.82)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 210 L250 230 C300 236 330 214 360 180 L410 120 C432 94 470 92 486 120 C500 146 480 168 452 176 L400 190 C380 196 382 222 404 226 L440 232 C470 238 470 270 440 272 L120 268 C70 266 30 240 34 210 C38 180 60 168 84 156 L180 108 C214 90 220 52 190 40 C160 28 130 50 120 76 L96 140 C88 166 70 196 60 210 Z"
            stroke="#ffffff" stroke-opacity=".12" stroke-width="20"/>
      <path class="track" d="M60 210 L250 230 C300 236 330 214 360 180 L410 120 C432 94 470 92 486 120 C500 146 480 168 452 176 L400 190 C380 196 382 222 404 226 L440 232 C470 238 470 270 440 272 L120 268 C70 266 30 240 34 210 C38 180 60 168 84 156 L180 108 C214 90 220 52 190 40 C160 28 130 50 120 76 L96 140 C88 166 70 196 60 210 Z"
            stroke="#ecedef" stroke-opacity=".7" stroke-width="2.5"/>
      <path class="sec" d="M60 210 L250 230 C300 236 330 214 360 180 L410 120 C432 94 470 92 486 120 C500 146 480 168 452 176 L400 190 C380 196 382 222 404 226 L440 232 C470 238 470 270 440 272 L120 268 C70 266 30 240 34 210 C38 180 60 168 84 156 L180 108 C214 90 220 52 190 40 C160 28 130 50 120 76 L96 140 C88 166 70 196 60 210 Z"
            stroke="url(#sector)" stroke-width="6"/>
      <!-- start / finish -->
      <rect x="146" y="206" width="5" height="34" fill="#ecedef" opacity=".8" transform="rotate(6 148 222)"/>
    </g>

    <!-- start lights -->
    <g transform="translate(76 52)">
      <rect x="0" y="0" width="236" height="56" rx="10" fill="#141519" stroke="#ffffff" stroke-opacity=".08"/>
      <g>
        <circle class="l l1" cx="30"  cy="28" r="15" fill="url(#red)"/>
        <circle class="l l2" cx="74"  cy="28" r="15" fill="url(#red)"/>
        <circle class="l l3" cx="118" cy="28" r="15" fill="url(#red)"/>
        <circle class="l l4" cx="162" cy="28" r="15" fill="url(#red)"/>
        <circle class="l l5" cx="206" cy="28" r="15" fill="url(#red)"/>
      </g>
      <text x="256" y="34" class="m pre">FIVE RED LIGHTS</text>
      <text class="go k" x="256" y="34" fill="#ecedef" style="fill:#8f45ff">LIGHTS OUT AND AWAY WE GO</text>
    </g>

    <!-- mark + wordmark -->
    <g transform="translate(70 150)"><g class="rise">
      <g transform="scale(2.6) skewX(-14) translate(8 0)">
        <rect x="4" y="3" width="6.5" height="26" rx="1" fill="#ecedef"/>
        <path fill-rule="evenodd" fill="#ecedef" d="M10.5 3H21a8.5 8.5 0 0 1 0 17H10.5v-5.6H20.6a2.9 2.9 0 0 0 0-5.8H10.5Z"/>
        <rect x="15" y="23.4" width="21" height="5.6" rx="1" fill="#8f45ff"/>
      </g>
      </g>
    </g>
    <g class="rise r2">
      <text x="196" y="232" class="t">PIT<tspan class="tl">WALL</tspan></text>
    </g>
    <text x="78" y="282" class="s rise r3">Who wins the next Grand Prix, and who takes the title?</text>
    <text x="78" y="322" class="m rise r4">RACE ODDS  ·  10,000-SEASON TITLE SIMS  ·  A PUBLIC RECORD OF EVERY CALL</text>

    <rect x="0" y="352" width="1200" height="8" fill="url(#sector)"/>
  </g>
</svg>
