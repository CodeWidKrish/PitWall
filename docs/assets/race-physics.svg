<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Race physics: cars lap a circuit with a DRS zone, racing line, dirty air, tow and overtakes, next to the speed envelope from the lap model. 98 to 324 km/h from hairpin to straight, 3 contact frames in 108,000 across six test races, DRS +10 km/h, tow +5 km/h">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c0e"/><stop offset=".6" stop-color="#121019"/><stop offset="1" stop-color="#0b0c0e"/></linearGradient>
    <linearGradient id="sector" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f45ff"/><stop offset="1" stop-color="#b98cff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="470" rx="22"/></clipPath>
    
    <style>
  .h   { font: italic 900 34px 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif; fill: #ecedef; letter-spacing: -.3px; }
  .hs  { font: italic 400 18px Georgia, 'Times New Roman', serif; fill: #b4b8bf; }
  .ct  { font: italic 800 21px 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif; fill: #ecedef; }
  .cl  { font: 500 13px Consolas, Menlo, 'DejaVu Sans Mono', monospace; fill: #c9ccd2; }
  .tg  { font: 700 11px Consolas, Menlo, 'DejaVu Sans Mono', monospace; fill: #8a9099; letter-spacing: 2px; }
  .num { font: italic 900 30px 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif; fill: #ecedef; }
  .sm  { font: 600 12px Consolas, Menlo, 'DejaVu Sans Mono', monospace; fill: #8a9099; }
  .flow { stroke-dasharray: 6 9; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -30; } }
  .breathe { animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { stroke-opacity: .45; } 50% { stroke-opacity: 1; } }</style>
  </defs>
  <g clip-path="url(#frame)">
  <rect width="1200" height="470" fill="url(#bg)"/><rect width="1200" height="470" fill="url(#grid)"/>

  <text x="60" y="56" class="h">THE CARS ARE NOT ON RAILS. THEY RACE.</text>
  <text x="60" y="82" class="hs">A lap-physics model sets every corner and straight; the race logic is pure TypeScript and tested headlessly</text>
  <g transform="translate(40 110) scale(1.02)">
    <path d="M60 210 L250 230 C300 236 330 214 360 180 L410 120 C432 94 470 92 486 120 C500 146 480 168 452 176 L400 190 C380 196 382 222 404 226 L440 232 C470 238 470 270 440 272 L120 268 C70 266 30 240 34 210 C38 180 60 168 84 156 L180 108 C214 90 220 52 190 40 C160 28 130 50 120 76 L96 140 C88 166 70 196 60 210 Z" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="26" stroke-linejoin="round"/>
    <path id="trk" d="M60 210 L250 230 C300 236 330 214 360 180 L410 120 C432 94 470 92 486 120 C500 146 480 168 452 176 L400 190 C380 196 382 222 404 226 L440 232 C470 238 470 270 440 272 L120 268 C70 266 30 240 34 210 C38 180 60 168 84 156 L180 108 C214 90 220 52 190 40 C160 28 130 50 120 76 L96 140 C88 166 70 196 60 210 Z" fill="none" stroke="#ecedef" stroke-opacity=".45" stroke-width="1.5"/>
    <path d="M250 230 C300 236 330 214 360 180" fill="none" stroke="#22c55e" stroke-width="5" stroke-opacity=".8"/>
    <text x="230" y="258" class="tg" style="fill:#22c55e">DRS ZONE</text>
    
    <text x="300" y="22" class="tg" style="fill:#b98cff">DIRTY AIR · TOW · OVERTAKES</text>
    <g><rect x="-7" y="-3.5" width="14" height="7" rx="3" fill="#8f45ff" stroke="#000" stroke-opacity=".4"/><animateMotion dur="9s" begin="0s" repeatCount="indefinite" rotate="auto"><mpath href="#trk"/></animateMotion></g>
    <g><rect x="-7" y="-3.5" width="14" height="7" rx="3" fill="#ff8000" stroke="#000" stroke-opacity=".4"/><animateMotion dur="9s" begin="-0.42s" repeatCount="indefinite" rotate="auto"><mpath href="#trk"/></animateMotion></g>
    <g><rect x="-7" y="-3.5" width="14" height="7" rx="3" fill="#27f4d2" stroke="#000" stroke-opacity=".4"/><animateMotion dur="9s" begin="-0.85s" repeatCount="indefinite" rotate="auto"><mpath href="#trk"/></animateMotion></g>
    <g><rect x="-7" y="-3.5" width="14" height="7" rx="3" fill="#ff2a36" stroke="#000" stroke-opacity=".4"/><animateMotion dur="9s" begin="-1.4s" repeatCount="indefinite" rotate="auto"><mpath href="#trk"/></animateMotion></g>
    <g><rect x="-7" y="-3.5" width="14" height="7" rx="3" fill="#3671c6" stroke="#000" stroke-opacity=".4"/><animateMotion dur="9s" begin="-1.9s" repeatCount="indefinite" rotate="auto"><mpath href="#trk"/></animateMotion></g>
  </g>
  <text x="600" y="126" class="tg">SPEED ENVELOPE OVER ONE LAP (KM/H)</text>
  <rect x="600" y="140" width="540" height="210" fill="#fff" fill-opacity=".02" stroke="#2a2833"/>
  <line x1="600" y1="320" x2="1140" y2="320" stroke="#2a2833" stroke-dasharray="2 5"/><text x="592" y="324" text-anchor="end" class="sm">100</text><line x1="600" y1="245" x2="1140" y2="245" stroke="#2a2833" stroke-dasharray="2 5"/><text x="592" y="249" text-anchor="end" class="sm">200</text><line x1="600" y1="170" x2="1140" y2="170" stroke="#2a2833" stroke-dasharray="2 5"/><text x="592" y="174" text-anchor="end" class="sm">300</text>
  <path id="spd" d="M600.0 170.0 C611.7 170.0 611.7 156.5 623.5 156.5 C635.2 156.5 635.2 153.5 647.0 153.5 C658.7 153.5 658.7 260.0 670.4 260.0 C682.2 260.0 682.2 306.5 693.9 306.5 C705.7 306.5 705.7 296.0 717.4 296.0 C729.1 296.0 729.1 241.3 740.9 241.3 C752.6 241.3 752.6 194.0 764.3 194.0 C776.1 194.0 776.1 180.5 787.8 180.5 C799.6 180.5 799.6 282.5 811.3 282.5 C823.0 282.5 823.0 323.0 834.8 323.0 C846.5 323.0 846.5 311.0 858.3 311.0 C870.0 311.0 870.0 252.5 881.7 252.5 C893.5 252.5 893.5 203.8 905.2 203.8 C917.0 203.8 917.0 170.0 928.7 170.0 C940.4 170.0 940.4 150.5 952.2 150.5 C963.9 150.5 963.9 147.5 975.7 147.5 C987.4 147.5 987.4 236.0 999.1 236.0 C1010.9 236.0 1010.9 273.5 1022.6 273.5 C1034.3 273.5 1034.3 261.5 1046.1 261.5 C1057.8 261.5 1057.8 215.0 1069.6 215.0 C1081.3 215.0 1081.3 177.5 1093.0 177.5 C1104.8 177.5 1104.8 173.0 1116.5 173.0 C1128.3 173.0 1128.3 170.0 1140.0 170.0" fill="none" stroke="url(#sector)" stroke-width="3"/>
  <circle r="6" fill="#ecedef" filter="url(#glow)"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#spd"/></animateMotion></circle>
  <text x="610" y="374" class="sm">corners: grip + downforce limit · straights: power vs drag · braking: grip limit</text>
  <g transform="translate(60 425)">
    <g transform="translate(0 0)"><text class="num" style="font-size:26px;fill:#b98cff">98–324</text><text x="104" y="-2" class="sm">km/h, hairpin to straight</text></g><g transform="translate(280 0)"><text class="num" style="font-size:26px;fill:#b98cff">3</text><text x="29" y="-2" class="sm">contact frames in 108,000</text></g><g transform="translate(560 0)"><text class="num" style="font-size:26px;fill:#b98cff">+10</text><text x="59" y="-2" class="sm">km/h from DRS</text></g><g transform="translate(840 0)"><text class="num" style="font-size:26px;fill:#b98cff">+5</text><text x="44" y="-2" class="sm">km/h from the tow</text></g>
  </g>
  <rect x="0" y="464" width="1200" height="6" fill="url(#sector)"/>
  </g>
</svg>
